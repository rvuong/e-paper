# Checks every push and pull request: formatting, lints and tests on the
# dev platform, then the release binary for the Raspberry Pi.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # The simulator, a dev-dependency, links against SDL2.
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  pi-build:
    name: Pi binary (aarch64 musl)
    # Only once the checks pass: no build for a commit that fails them.
    needs: [fmt, clippy, test]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # ring compiles C code: build it against musl.
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target aarch64-unknown-linux-musl
        env:
          CC_aarch64_unknown_linux_musl: musl-gcc
